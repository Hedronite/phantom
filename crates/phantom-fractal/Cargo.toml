[package]
name = "phantom-fractal"
description = "Phantom command line: `phantom-fractal` and `fract`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "phantom-fractal"
path = "src/main.rs"

[[bin]]
name = "fract"
path = "src/main.rs"

[dependencies]
blake3 = "1"
clap = { version = "4.6", features = ["derive"] }
phantom-fractal-analyze = { path = "../phantom-fractal-analyze", version = "0.0.0" }
phantom-fractal-extract = { path = "../phantom-fractal-extract", version = "0.0.0" }
phantom-fractal-git = { path = "../phantom-fractal-git", version = "0.0.0" }
phantom-fractal-lang.workspace = true
phantom-fractal-lang-rust = { path = "../phantom-fractal-lang-rust", version = "0.0.0" }
phantom-fractal-proto = { path = "../phantom-fractal-proto", version = "0.0.0" }
phantom-fractal-store = { path = "../phantom-fractal-store", version = "0.0.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
