# Rust-TOPS drop-in skeleton. Place at deny.toml and complete licenses for your org.

[advisories]
yanked = "deny"
# ignore = [
#   { id = "RUSTSEC-0000-0000", reason = "dev-only; tracked in rust-tops.yaml exemptions" },
# ]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies are unpublished; they carry no registry version.
allow-wildcard-paths = true
highlight = "all"
# Phantom makes no network calls. No HTTP client may enter the graph.
deny = [
  { name = "reqwest", reason = "Phantom has no HTTP client" },
  { name = "ureq", reason = "Phantom has no HTTP client" },
  { name = "curl", reason = "Phantom has no HTTP client" },
  { name = "isahc", reason = "Phantom has no HTTP client" },
  { name = "hyper", reason = "Phantom has no HTTP client" },
  { name = "openssl-sys", reason = "Phantom has no TLS" },
  { name = "gix-credentials", reason = "Phantom never authenticates" },
  { name = "gix-index", reason = "Phantom reads no git index" },
  { name = "gix-worktree", reason = "Phantom never touches a work tree" },
  { name = "gix-worktree-state", reason = "Phantom never checks out" },
  { name = "gix-status", reason = "Phantom runs no status" },
  { name = "gix-merge", reason = "Phantom never merges" },
  { name = "gix-filter", reason = "Phantom runs no filter driver" },
  { name = "gix-negotiate", reason = "Phantom never fetches" },
]
features = [
  { crate = "gix", deny = ["blocking-network-client", "async-network-client", "worktree-mutation", "index", "status", "merge", "credentials", "command", "attributes", "blob-diff", "interrupt"] },
  { crate = "gix-protocol", deny = ["blocking-client", "async-client", "handshake", "fetch"] },
  { crate = "gix-transport", deny = ["blocking-client", "async-client", "http-client", "http-client-curl", "http-client-reqwest"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
