# Rust-TOPS drop-in skeleton. Place at deny.toml and complete licenses for your org.

[advisories]
yanked = "deny"
# ignore = [
#   { id = "RUSTSEC-0000-0000", reason = "dev-only; tracked in rust-tops.yaml exemptions" },
# ]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies are unpublished; they carry no registry version.
allow-wildcard-paths = true
highlight = "all"
# Phantom makes no network calls. No HTTP client may enter the graph.
deny = [
  { name = "reqwest", reason = "Phantom has no HTTP client" },
  { name = "ureq", reason = "Phantom has no HTTP client" },
  { name = "curl", reason = "Phantom has no HTTP client" },
  { name = "isahc", reason = "Phantom has no HTTP client" },
  { name = "hyper", reason = "Phantom has no HTTP client" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
